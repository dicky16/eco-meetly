<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#064E3B" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>

  <!-- App Window -->
  <rect x="36" y="28" width="1128" height="664" rx="16" fill="#FFFFFF" stroke="#D1FAE5" stroke-width="2" filter="url(#shadow)"/>

  <!-- Sidebar -->
  <rect x="36" y="28" width="256" height="664" rx="16" fill="#FFFFFF"/>
  <line x1="292" y1="28" x2="292" y2="692" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Brand Header -->
  <rect x="54" y="48" width="38" height="38" rx="10" fill="#10B981"/>
  <path d="M67 74 C67 63, 76 58, 82 58 C82 68, 76 74, 67 74 Z" fill="#FFFFFF"/>
  <text x="104" y="65" font-size="16" font-weight="700" fill="#064E3B">Eco Meetly</text>
  <text x="104" y="82" font-size="11" fill="#64748B">Offline AI Meeting Notes</text>

  <!-- Sidebar Buttons -->
  <rect x="54" y="106" width="220" height="38" rx="8" fill="#10B981"/>
  <text x="164" y="130" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">● New Recording</text>
  <rect x="54" y="152" width="220" height="34" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="164" y="173" text-anchor="middle" font-size="12" font-weight="500" fill="#334155">↑ Import Audio File</text>

  <!-- Search -->
  <rect x="54" y="196" width="220" height="30" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="70" y="215" font-size="11" fill="#94A3B8">Search meetings...</text>

  <!-- Meeting List -->
  <text x="56" y="248" font-size="10" font-weight="700" fill="#64748B">MEETINGS (3)</text>
  <rect x="50" y="258" width="228" height="54" rx="8" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="62" y="280" font-size="12" font-weight="600" fill="#065F46">Product Release Sync</text>
  <text x="62" y="298" font-size="11" fill="#059669">02:14 • ID + EN • Live</text>

  <rect x="50" y="320" width="228" height="50" rx="8" fill="#FFFFFF"/>
  <text x="62" y="341" font-size="12" font-weight="500" fill="#1E293B">Weekly Engineering Review</text>
  <text x="62" y="357" font-size="11" fill="#64748B">24:10 • ID</text>

  <rect x="50" y="376" width="228" height="50" rx="8" fill="#FFFFFF"/>
  <text x="62" y="397" font-size="12" font-weight="500" fill="#1E293B">Client Onboarding Call</text>
  <text x="62" y="413" font-size="11" fill="#64748B">18:45 • EN</text>

  <!-- Sidebar Footer -->
  <line x1="36" y1="636" x2="292" y2="636" stroke="#E2E8F0" stroke-width="1"/>
  <text x="66" y="668" font-size="13" font-weight="500" fill="#334155">⚙ Settings</text>

  <!-- Top Toolbar -->
  <line x1="292" y1="92" x2="1164" y2="92" stroke="#E2E8F0" stroke-width="1"/>
  <circle cx="322" cy="60" r="6" fill="#10B981"/>
  <text x="336" y="65" font-size="15" font-weight="700" fill="#059669">02:14</text>
  <rect x="392" y="55" width="96" height="10" rx="5" fill="#E2E8F0"/>
  <rect x="392" y="55" width="66" height="10" rx="5" fill="#10B981"/>

  <!-- Toolbar Pills & Controls -->
  <rect x="580" y="44" width="186" height="32" rx="16" fill="#ECFDF5" stroke="#6EE7B7"/>
  <text x="673" y="64" text-anchor="middle" font-size="11" font-weight="600" fill="#065F46">Bilingual (ID + EN) • Configure</text>

  <rect x="776" y="44" width="114" height="32" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="833" y="64" text-anchor="middle" font-size="11" fill="#475569">Audio Save: ON</text>

  <rect x="900" y="44" width="84" height="32" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="942" y="64" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">❚❚ Pause</text>

  <rect x="994" y="44" width="146" height="32" rx="8" fill="#EF4444"/>
  <text x="1067" y="64" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">■ Stop Recording</text>

  <!-- Split Main Area -->
  <line x1="728" y1="92" x2="728" y2="692" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Left: Transcript -->
  <rect x="292" y="92" width="436" height="48" fill="#F8FAFC"/>
  <line x1="292" y1="140" x2="728" y2="140" stroke="#E2E8F0" stroke-width="1"/>
  <text x="316" y="121" font-size="14" font-weight="700" fill="#0F172A">Transcript (4)</text>
  <rect x="598" y="103" width="112" height="26" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="654" y="120" text-anchor="middle" font-size="11" fill="#334155">📁 Meeting Folder</text>

  <!-- Bubble 1 -->
  <rect x="312" y="158" width="396" height="78" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="326" y="170" width="76" height="22" rx="11" fill="#D1FAE5" stroke="#6EE7B7"/>
  <text x="364" y="185" text-anchor="middle" font-size="11" font-weight="700" fill="#065F46">Speaker 1</text>
  <text x="412" y="185" font-size="11" fill="#64748B">00:02 – 00:08</text>
  <rect x="668" y="170" width="26" height="20" rx="4" fill="#ECFDF5"/>
  <text x="681" y="184" text-anchor="middle" font-size="10" font-weight="700" fill="#059669">ID</text>
  <text x="326" y="215" font-size="13" fill="#1E293B">Kita pastikan rilis perdana berjalan lancar minggu ini.</text>

  <!-- Bubble 2 -->
  <rect x="312" y="248" width="396" height="78" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="326" y="260" width="76" height="22" rx="11" fill="#E0F2FE" stroke="#7DD3FC"/>
  <text x="364" y="275" text-anchor="middle" font-size="11" font-weight="700" fill="#0369A1">Speaker 2</text>
  <text x="412" y="275" font-size="11" fill="#64748B">00:09 – 00:16</text>
  <rect x="668" y="260" width="26" height="20" rx="4" fill="#ECFDF5"/>
  <text x="681" y="274" text-anchor="middle" font-size="10" font-weight="700" fill="#059669">EN</text>
  <text x="326" y="305" font-size="13" fill="#1E293B">All 22 unit tests and builds are green on CI.</text>

  <!-- Bubble 3 -->
  <rect x="312" y="338" width="396" height="78" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="326" y="350" width="76" height="22" rx="11" fill="#D1FAE5" stroke="#6EE7B7"/>
  <text x="364" y="365" text-anchor="middle" font-size="11" font-weight="700" fill="#065F46">Speaker 1</text>
  <text x="412" y="365" font-size="11" fill="#64748B">00:17 – 00:24</text>
  <rect x="668" y="350" width="26" height="20" rx="4" fill="#ECFDF5"/>
  <text x="681" y="364" text-anchor="middle" font-size="10" font-weight="700" fill="#059669">ID</text>
  <text x="326" y="395" font-size="13" fill="#1E293B">Bagus, otomatis installer Mac dan Windows siap rilis.</text>

  <!-- Right: Summary -->
  <rect x="728" y="92" width="436" height="48" fill="#F8FAFC"/>
  <line x1="728" y1="140" x2="1164" y2="140" stroke="#E2E8F0" stroke-width="1"/>
  <text x="748" y="121" font-size="14" font-weight="700" fill="#0F172A">Local AI Summary</text>
  <rect x="1044" y="103" width="100" height="26" rx="6" fill="#10B981"/>
  <text x="1094" y="120" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">✦ Summarize</text>

  <text x="748" y="168" font-size="11" fill="#64748B">Model: <tspan font-weight="700" fill="#0F172A">Qwen 2.5 3B Instruct (Q4_K_M)</tspan></text>

  <rect x="748" y="182" width="396" height="270" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="766" y="210" font-size="13" font-weight="700" fill="#065F46">## Executive Summary</text>
  <text x="766" y="232" font-size="12" fill="#334155">Tim menyepakati kesiapan rilis perdana Eco Meetly.</text>
  <text x="766" y="250" font-size="12" fill="#334155">Seluruh 22 unit test dan build macOS/Windows lulus.</text>

  <text x="766" y="286" font-size="13" font-weight="700" fill="#065F46">## Key Decisions</text>
  <text x="766" y="308" font-size="12" fill="#334155">• Rilis v0.1.0 dipublikasikan via GitHub Actions.</text>
  <text x="766" y="326" font-size="12" fill="#334155">• Retensi maksimal 10 tag rilis aktif.</text>

  <text x="766" y="362" font-size="13" font-weight="700" fill="#065F46">## Action Items</text>
  <text x="766" y="384" font-size="12" fill="#334155">☐ Verifikasi installer .dmg (macOS) &amp; .exe (Windows)</text>
  <text x="766" y="404" font-size="12" fill="#334155">☐ Uji alur transkripsi offline &amp; ringkasan lokal</text>
</svg>
